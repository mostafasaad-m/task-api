name: Deploy Task API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH/Rsync
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        # rsync flags ensuring clean, permission-safe synchronization
        ARGS: "-rlgoDIVz --delete --no-perms --no-owner --omit-dir-times"
        REMOTE_HOST: "140.238.100.3"      # Replace with your Oracle Cloud Public IP
        REMOTE_USER: "deployer"    # Replace with your server username (e.g., ubuntu or deployer)
        TARGET: "/opt/projects/"

    - name: Restart Docker Containers
      uses: appleboy/ssh-action@master
      with:
        host: "140.238.100.3"           
        username: "deployer"       
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/projects/
          if [ -f docker-compose.yml ]; then
            docker-compose down
            docker-compose up -d --build
          else
            echo "docker-compose.yml not found in /opt/projects/"
          fi