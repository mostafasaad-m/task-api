services:
  postgres:
    image: postgres:17

    container_name: task-api-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: supersecretpassword

    ports:
      - "5432:5432"

    volumes:
      - task-api-postgres:/var/lib/postgresql/data

    networks:
      - backend

volumes:
  task-api-postgres:

networks:
  backend:
    external: true